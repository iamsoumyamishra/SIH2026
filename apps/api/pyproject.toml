[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests"]
python_files = ["test_*.py"]
cache_dir = ".pytest_cache"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
